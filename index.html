<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acme Support - Contact Us</title>
</head>
<body>

    <header>
        <h1>Acme Support</h1>
        <nav>
            <a href="#">Home</a> |
            <a href="#">Help</a> |
            <a href="#">Contact</a>
        </nav>
        <hr>
    </header>

    <main>
        <h2>Contact us</h2>
        <p>Send us a message and we will get back to you.</p>

        <!-- Form starts here -->
        <form action="/submit-contact-form" method="post">
            
            <!-- Full Name -->
            <div>
                <label for="fullName">Full name</label><br>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <br>

            <!-- Email -->
            <div>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required>
            </div>
            <br>

            <!-- Subject -->
            <div>
                <label for="subject">Subject</label><br>
                <select id="subject" name="subject" required>
                    <option value="" disabled selected>Choose a topic</option>
                    <option value="technical">Technical Support</option>
                    <option value="billing">Billing Inquiry</option>
                    <option value="feedback">General Feedback</option>
                </select>
            </div>
            <br>

            <!-- Message -->
            <div>
                <label for="message">Message</label><br>
                <textarea id="message" name="message" rows="5" minlength="10" required></textarea>
            </div>
            <br>

            <!-- Radio Buttons Fieldset -->
            <fieldset>
                <legend>How did you hear about us?</legend>
                <div>
                    <input type="radio" id="source-search" name="source" value="search">
                    <label for="source-search">Search</label>
                </div>
                <div>
                    <input type="radio" id="source-friend" name="source" value="friend">
                    <label for="source-friend">Friend</label>
                </div>
                <div>
                    <input type="radio" id="source-social" name="source" value="social">
                    <label for="source-social">Social media</label>
                </div>
            </fieldset>
            <br>

            <!-- Newsletter Checkbox -->
            <div>
                <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                <label for="newsletter">Send me product updates</label>
            </div>
            <br>

            <!-- Submit Button -->
            <button type="submit">Send message</button>
        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Acme Support</p>
    </footer>

</body>
</html>
